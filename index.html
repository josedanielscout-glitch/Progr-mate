<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prográmate | Eventos Anteriores</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            /* Theme Colors */
            --primary: #6C63FF;
            --secondary: #FF6584;
            --accent: #FFD93D;
            --bg-color: #f8fafc;
            
            /* Grays */
            --gray-100: #f3f4f6;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-800: #1f2937;
            
            /* Category Gradients */
            --grad-ecologica: linear-gradient(to right, #4ade80, #059669);
            --grad-cultural: linear-gradient(to right, #fb923c, #ef4444);
            --grad-socioeconomica: linear-gradient(to right, #facc15, #d97706);
            --grad-espiritual: linear-gradient(to right, #c084fc, #7c3aed);
            --grad-psicoafectiva: linear-gradient(to right, #f472b6, #e11d48);
            --grad-acompanamiento: linear-gradient(to right, #60a5fa, #4f46e5);
            --grad-fisica: linear-gradient(to right, #f87171, #e11d48);
            --grad-pastoral: linear-gradient(to right, #818cf8, #2563eb);
            --grad-default: linear-gradient(to right, #9ca3af, #4b5563);

            /* Category Text/Hover Colors */
            --color-ecologica: #22c55e;     --hover-ecologica: #16a34a;
            --color-cultural: #f97316;      --hover-cultural: #ea580c;
            --color-socioeconomica: #eab308;--hover-socioeconomica: #ca8a04;
            --color-espiritual: #a855f7;    --hover-espiritual: #9333ea;
            --color-psicoafectiva: #ec4899; --hover-psicoafectiva: #db2777;
            --color-acompanamiento: #3b82f6;--hover-acompanamiento: #2563eb;
            --color-fisica: #ef4444;        --hover-fisica: #dc2626;
            --color-pastoral: #6366f1;      --hover-pastoral: #4f46e5;
            --color-default: #6b7280;       --hover-default: #4b5563;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--gray-800);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        ::selection {
            background-color: var(--accent);
            color: black;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }

        .container {
            max-width: 80rem; /* max-w-7xl */
            margin: 0 auto;
            padding: 3rem 0.5rem; /* px-2 py-12 */
            position: relative;
            z-index: 10;
        }
        
        @media (min-width: 640px) { .container { padding-left: 1rem; padding-right: 1rem; } }
        @media (min-width: 768px) { .container { padding-left: 1.5rem; padding-right: 1.5rem; } }
        @media (min-width: 1024px) { .container { padding-left: 2rem; padding-right: 2rem; } }

        /* Header Styling */
        .header {
            text-align: center;
            margin-bottom: 2rem;
            opacity: 0;
            animation: fadeUp 0.8s ease-out forwards;
        }
        @media (min-width: 768px) { .header { margin-bottom: 3rem; } }

        .header h1 {
            font-size: 1.875rem; /* text-3xl */
            font-weight: 800;
            letter-spacing: -0.025em;
            margin-bottom: 1rem;
        }
        @media (min-width: 768px) { .header h1 { font-size: 3rem; } }
        @media (min-width: 1024px) { .header h1 { font-size: 4.5rem; } }

        .text-shimmer {
            background: linear-gradient(to right, var(--primary), #a855f7, var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            background-size: 200% auto;
            animation: textShimmer 3s ease-in-out infinite alternate;
        }

        .header-divider {
            height: 0.25rem;
            width: 4rem;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            margin: 0 auto;
            border-radius: 9999px;
        }
        @media (min-width: 768px) { .header-divider { width: 6rem; } }

        .header p {
            margin-top: 1rem;
            color: var(--gray-500);
            font-weight: 500;
            max-width: 36rem;
            margin-left: auto;
            margin-right: auto;
            font-size: 0.875rem;
        }
        @media (min-width: 768px) { .header p { font-size: 1rem; } }

        /* Events Grid */
        .events-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 0.5rem;
        }
        @media (min-width: 640px) { .events-grid { gap: 1rem; } }
        @media (min-width: 768px) { .events-grid { gap: 1.5rem; } }
        @media (min-width: 1024px) { .events-grid { gap: 2rem; } }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            border-radius: 0.75rem;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            opacity: 0;
            animation: fadeUp 0.8s ease-out forwards;
            overflow: hidden;
        }
        @media (min-width: 768px) { .glass-card { border-radius: 2rem; } }

        .glass-card:hover {
            transform: translateY(-8px) scale(1.02);
            background: rgba(255, 255, 255, 0.95);
            border-color: rgba(255, 255, 255, 1);
            z-index: 10;
            box-shadow: 0 20px 40px -5px rgba(0,0,0,0.1);
        }

        .glass-card::after {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.6), transparent);
            transform: skewX(-25deg);
            z-index: 10;
            transition: 0s; 
            pointer-events: none;
        }
        .glass-card:hover::after {
            left: 200%;
            transition: 0.75s ease-in-out;
        }

        /* Card Image & Badge */
        .card-img-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 4/3;
            overflow: hidden;
            flex-shrink: 0;
            filter: grayscale(20%);
            transition: all 0.5s;
        }
        @media (min-width: 768px) {
            .card-img-wrapper { height: 12rem; aspect-ratio: auto; }
        }
        .glass-card:hover .card-img-wrapper { filter: grayscale(0%); }

        .card-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.7s;
        }
        .glass-card:hover .card-img-wrapper img { transform: scale(1.1); }

        .card-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.6), transparent, transparent);
            opacity: 0.8;
        }

        .card-badge {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(4px);
            font-size: 8px;
            font-weight: 700;
            padding: 0.25rem 0.5rem;
            border-radius: 9999px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 0.25rem;
            color: var(--gray-800);
            border: 1px solid white;
            z-index: 10;
        }
        @media (min-width: 768px) {
            .card-badge { top: 1rem; right: 1rem; font-size: 0.75rem; padding: 0.375rem 0.75rem; gap: 0.375rem; }
        }

        .badge-text-mobile { display: inline-block; max-width: 50px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .badge-text-desktop { display: none; }
        @media (min-width: 768px) {
            .badge-text-mobile { display: none; }
            .badge-text-desktop { display: inline; }
        }

        .card-content {
            padding: 0.5rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background: rgba(255, 255, 255, 0.4);
        }
        @media (min-width: 768px) { .card-content { padding: 1.5rem; } }

        .card-date {
            position: absolute;
            top: -1rem;
            left: 0.5rem;
            background: white;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            padding: 0.125rem;
            text-align: center;
            width: 2.5rem;
            height: 2.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px solid var(--gray-100);
            transition: transform 0.3s;
            z-index: 10;
        }
        @media (min-width: 768px) {
            .card-date { top: -2rem; left: 1.5rem; border-radius: 0.75rem; padding: 0.25rem; width: 4rem; height: 4rem; }
        }
        .glass-card:hover .card-date { transform: translateY(-0.25rem); }
        @media (min-width: 768px) { .glass-card:hover .card-date { transform: translateY(-0.5rem); } }

        .card-date-month { font-size: 7px; font-weight: 700; color: var(--gray-400); text-transform: uppercase; letter-spacing: 0.1em; line-height: 1; margin-bottom: 1px; }
        .card-date-day { font-size: 0.875rem; font-weight: 900; color: var(--gray-800); line-height: 1; }
        @media (min-width: 768px) {
            .card-date-month { font-size: 10px; margin-bottom: 2px; }
            .card-date-day { font-size: 1.5rem; }
        }

        .card-title-container { margin-top: 1.75rem; margin-bottom: 0.25rem; }
        @media (min-width: 768px) { .card-title-container { margin-top: 2rem; margin-bottom: 0.5rem; } }

        .card-title {
            font-size: 10px;
            font-weight: 700;
            color: var(--gray-800);
            line-height: 1.25;
            transition: color 0.3s;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        @media (min-width: 768px) {
            .card-title { font-size: 1.25rem; -webkit-line-clamp: 2; }
        }

        .card-desc-container { margin-bottom: 1rem; flex: 1; }
        @media (min-width: 768px) { .card-desc-container { margin-bottom: 1.5rem; } }
        
        .card-desc {
            font-size: 9px;
            color: var(--gray-500);
            font-weight: 500;
            line-height: 1.625;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        @media (min-width: 768px) { .card-desc { font-size: 0.875rem; -webkit-line-clamp: 3; } }

        .card-action { margin-top: auto; position: relative; z-index: 20; }
        
        .btn-shine {
            position: relative;
            overflow: hidden;
            display: block;
            width: 100%;
            text-align: center;
            color: white;
            font-weight: 700;
            padding: 0.375rem 0;
            border-radius: 0.5rem;
            text-decoration: none;
            transition: all 0.3s;
            box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05);
        }
        @media (min-width: 768px) {
            .btn-shine { padding: 0.75rem 0; border-radius: 1rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        }
        
        .glass-card:hover .btn-shine { transform: scale(1.02); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }

        .btn-shine::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.4), transparent);
            transform: skewX(-20deg);
            animation: shine 4s infinite;
        }

        .btn-content { position: relative; z-index: 10; display: flex; align-items: center; justify-content: center; gap: 0.25rem; }
        @media (min-width: 768px) { .btn-content { gap: 0.5rem; } }
        
        .btn-text { font-size: 9px; }
        .btn-icon { font-size: 8px; transition: transform 0.3s; }
        @media (min-width: 768px) {
            .btn-text { font-size: 1rem; }
            .btn-icon { font-size: 0.875rem; }
        }
        .glass-card:hover .btn-icon { transform: scale(1.1); }

        /* Empty State */
        .empty-state { text-align: center; padding: 5rem 0; display: none; }
        .empty-icon { font-size: 2.25rem; margin-bottom: 1rem; color: var(--gray-300); }
        .empty-text { font-size: 1.25rem; font-weight: 700; color: var(--gray-400); }
        @media (min-width: 768px) {
            .empty-icon { font-size: 3.75rem; }
            .empty-text { font-size: 1.5rem; }
        }

        .blob-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
            background: #fff;
        }
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.8;
            mix-blend-mode: multiply; 
            animation: blob 15s infinite alternate;
        }
        .blob-1 { background-color: #d8b4fe; width: 24rem; height: 24rem; top: 0; left: 0; }
        .blob-2 { background-color: #f9a8d4; width: 24rem; height: 24rem; bottom: 0; right: 0; animation-delay: 2s; }
        .blob-3 { background-color: #a5f3fc; width: 20rem; height: 20rem; top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: 4s; }

        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(40px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes textShimmer {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }
        @keyframes shine {
            0% { left: -100%; }
            20% { left: 100%; }
            100% { left: 100%; }
        }

        /* Dynamic Category Classes utilized by JavaScript */
        .text-cat-ecologica { color: var(--color-ecologica); }
        .text-cat-cultural { color: var(--color-cultural); }
        .text-cat-socioeconomica { color: var(--color-socioeconomica); }
        .text-cat-espiritual { color: var(--color-espiritual); }
        .text-cat-psicoafectiva { color: var(--color-psicoafectiva); }
        .text-cat-acompanamiento { color: var(--color-acompanamiento); }
        .text-cat-fisica { color: var(--color-fisica); }
        .text-cat-pastoral { color: var(--color-pastoral); }
        .text-cat-default { color: var(--color-default); }

        .glass-card:hover .hover-cat-ecologica { color: var(--hover-ecologica); }
        .glass-card:hover .hover-cat-cultural { color: var(--hover-cultural); }
        .glass-card:hover .hover-cat-socioeconomica { color: var(--hover-socioeconomica); }
        .glass-card:hover .hover-cat-espiritual { color: var(--hover-espiritual); }
        .glass-card:hover .hover-cat-psicoafectiva { color: var(--hover-psicoafectiva); }
        .glass-card:hover .hover-cat-acompanamiento { color: var(--hover-acompanamiento); }
        .glass-card:hover .hover-cat-fisica { color: var(--hover-fisica); }
        .glass-card:hover .hover-cat-pastoral { color: var(--hover-pastoral); }
        .glass-card:hover .hover-cat-default { color: var(--hover-default); }

        .bg-cat-ecologica { background: var(--grad-ecologica); }
        .bg-cat-cultural { background: var(--grad-cultural); }
        .bg-cat-socioeconomica { background: var(--grad-socioeconomica); }
        .bg-cat-espiritual { background: var(--grad-espiritual); }
        .bg-cat-psicoafectiva { background: var(--grad-psicoafectiva); }
        .bg-cat-acompanamiento { background: var(--grad-acompanamiento); }
        .bg-cat-fisica { background: var(--grad-fisica); }
        .bg-cat-pastoral { background: var(--grad-pastoral); }
        .bg-cat-default { background: var(--grad-default); }

    </style>
</head>

    <div class="blob-container">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>

    <!-- Main Container -->

            }
        ];

        let events = [...initialEvents];

        // --- DOM Elements ---
        const grid = document.getElementById('events-grid');
        const emptyState = document.getElementById('empty-state');

        // --- Formatting Functions ---
        const getMonth = (dateStr) => new Date(dateStr).toLocaleDateString('es-ES', {month: 'short'}).replace('.', '').toUpperCase();
        const getDay = (dateStr) => new Date(dateStr).getDate() + 1;

        // --- STREAMING_CHUNK: Rendering the DOM elements with standard CSS classes ---
        const renderEvents = () => {
            grid.innerHTML = '';
            
            if (events.length === 0) {
                emptyState.style.display = 'block';
            } else {
                emptyState.style.display = 'none';
                
                events.forEach((event, index) => {
                    const catKey = categoryConfig[event.category] ? event.category : 'default';
                    const config = categoryConfig[catKey];
                    
                    const card = document.createElement('div');
                    card.style.animationDelay = `${index * 150}ms`;
                    card.className = 'glass-card';
                    
                    card.innerHTML = `
                        <!-- Imagen -->
                        <div class="card-img-wrapper">
                            <img src="${event.image}" alt="${event.title}">
                            <div class="card-overlay"></div>
                            <!-- Category Badge -->
                            <div class="card-badge">
                                <i class="fas ${config.icon} text-cat-${catKey}"></i> 
                                <span class="badge-text-desktop">${config.label}</span> 
                                <span class="badge-text-mobile">${config.label}</span>
                            </div>
                        </div>
                        
                        <!-- Contenido -->
                        <div class="card-content">
                            <!-- Fecha Flotante -->
                            <div class="card-date">
                                <span class="card-date-month">${getMonth(event.date)}</span>
                                <span class="card-date-day">${getDay(event.date)}</span>
                            </div>

                            <!-- Título -->
                            <div class="card-title-container">
                                <h3 class="card-title hover-cat-${catKey}" title="${event.title}">
                                    ${event.title}
                                </h3>
                            </div>

                            <!-- Descripción -->
                            <div class="card-desc-container">
                                <p class="card-desc">
                                    ${event.description || 'Descripción breve disponible.'}
                                </p>
                            </div>
                            
                            <!-- Botón de Acción -->
                            <div class="card-action">
                                <a href="${event.link}" target="_blank" class="btn-shine bg-cat-${catKey}">
                                    <span class="btn-content">
                                        <span class="btn-text">Ver video</span> 
                                        <i class="fas fa-play btn-icon"></i>
                                    </span>
                                </a>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            }
        };

        renderEvents();

    </script>
</body>
</html>
