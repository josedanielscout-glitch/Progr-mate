<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prográmate | Agenda Universitaria</title>
    
    <!-- Google Fonts & Font Awesome se mantienen por ser recursos de tipografía e iconos optimizados -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #6C63FF;
            --secondary: #FF6584;
            --accent: #FFD93D;
            --bg-color: #f8fafc;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --text-light: #9ca3af;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }

        .blob-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
            background: #fff;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            mix-blend-mode: multiply; 
            animation: blobAnim 15s infinite alternate;
        }

        .blob-1 { background: #d8b4fe; width: 400px; height: 400px; top: -10%; left: -10%; }
        .blob-2 { background: #f9a8d4; width: 400px; height: 400px; bottom: -10%; right: -10%; animation-delay: 2s; }
        .blob-3 { background: #a5f3fc; width: 350px; height: 350px; top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: 4s; }

        .container {
            max-w-width: 1280px;
            margin: 0 auto;
            padding: 3rem 1rem;
            position: relative;
            z-index: 10;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            opacity: 0;
            animation: fadeUp 0.8s ease-out forwards;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 1rem;
        }

        .shimmer-text {
            background: linear-gradient(to right, var(--primary), #a855f7, var(--secondary));
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: textShimmer 3s ease-in-out infinite alternate;
        }

        .header-divider {
            height: 4px;
            width: 80px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            margin: 0 auto;
            border-radius: 99px;
        }

        .events-grid {
            display: grid;
            grid-template-columns: 1fr; /* 1 Columna en móviles */
            gap: 1.5rem;
        }

        @media (min-width: 640px) {
            .events-grid { grid-template-columns: repeat(2, 1fr); } /* 2 Columnas en tablets */
        }

        @media (min-width: 1024px) {
            .events-grid { grid-template-columns: repeat(3, 1fr); gap: 2rem; } /* 3 Columnas en PC */
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 1.5rem;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            opacity: 0;
            animation: fadeUp 0.8s ease-out forwards;
        }

        .glass-card:hover {
            transform: translateY(-8px) scale(1.02);
            background: rgba(255, 255, 255, 0.95);
            border-color: rgba(255, 255, 255, 1);
            z-index: 10;
            box-shadow: 0 20px 40px -5px rgba(0,0,0,0.1);
        }

        /* Efecto de brillo en la tarjeta */
        .glass-card::after {
            content: "";
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.6), transparent);
            transform: skewX(-25deg);
            z-index: 10;
            transition: 0s; 
            pointer-events: none;
        }

        .glass-card:hover::after {
            left: 200%;
            transition: 0.75s ease-in-out;
        }

        .card-image-wrapper {
            position: relative;
            width: 100%;
            height: 200px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.7s ease;
        }

        .glass-card:hover .card-image {
            transform: scale(1.1);
        }

        .card-image-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.6), transparent);
        }

        .category-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(4px);
            padding: 0.4rem 0.8rem;
            border-radius: 99px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.4rem;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            border: 1px solid white;
            z-index: 10;
        }

        .card-content {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex: 1;
            position: relative;
            background: rgba(255, 255, 255, 0.4);
        }

        .date-badge {
            position: absolute;
            top: -2rem;
            left: 1.5rem;
            background: white;
            border-radius: 0.75rem;
            padding: 0.5rem;
            width: 3.5rem;
            height: 3.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            border: 1px solid #f3f4f6;
            transition: transform 0.3s ease;
            z-index: 10;
        }

        .glass-card:hover .date-badge { transform: translateY(-4px); }

        .date-month { font-size: 0.65rem; font-weight: 800; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.1em; line-height: 1; margin-bottom: 2px; }
        .date-day { font-size: 1.25rem; font-weight: 900; color: var(--text-main); line-height: 1; }

        .card-title {
            font-size: 1.25rem;
            font-weight: 800;
            line-height: 1.2;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
            color: var(--text-main);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            transition: color 0.3s ease;
        }

        .glass-card:hover .card-title { color: var(--cat-color, var(--primary)); }

        .card-desc {
            font-size: 0.875rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 1rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-info-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.875rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .info-icon {
            width: 2rem;
            height: 2rem;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-light);
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            transition: color 0.3s;
        }

        .glass-card:hover .info-icon { color: var(--cat-color, var(--primary)); }
        
        .info-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-action {
            margin-top: auto;
            display: block;
            width: 100%;
            text-align: center;
            color: white;
            font-weight: 700;
            padding: 0.75rem 1rem;
            border-radius: 1rem;
            text-decoration: none;
            background: linear-gradient(to right, var(--cat-grad-start, var(--primary)), var(--cat-grad-end, var(--secondary)));
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        .btn-action:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }

        @keyframes blobAnim {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(40px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes textShimmer {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        .empty-state {
            text-align: center;
            padding: 5rem 1rem;
            display: none;
        }
        .empty-icon { font-size: 4rem; margin-bottom: 1rem; color: #d1d5db; }
        .empty-text { font-size: 1.5rem; font-weight: 700; color: #9ca3af; }

        @media (min-width: 768px) { h1 { font-size: 3.5rem; } }
        @media (min-width: 1024px) { h1 { font-size: 4.5rem; } .container { padding: 4rem 2rem; } }
    </style>
</head>
<body>

    <!-- Dynamic Background -->
    <div class="blob-container">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- Main Container -->
    <div class="container">
        
        <!-- Header -->
        <header>
            <h1>
                <span class="shimmer-text">Agenda de Eventos</span>
            </h1>
            <div class="header-divider"></div>
        </header>

        <!-- Events Grid -->
        <div id="events-grid" class="events-grid">
            <!-- Cards serán inyectadas por JS -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="empty-state">
            <div class="empty-icon">🍃</div>
            <h3 class="empty-text">Todo tranquilo por aquí...</h3>
        </div>

    </div>

    <script>
        // --- Configuración de Categorías (Con variables CSS nativas) ---
        const categoryConfig = {
            ecologica: { label: 'Ecológica', icon: 'fa-leaf', color: '#10b981', gradStart: '#4ade80', gradEnd: '#059669' },
            cultural: { label: 'Cultural', icon: 'fa-palette', color: '#f97316', gradStart: '#fb923c', gradEnd: '#ef4444' },
            socioeconomica: { label: 'Socioeconómica', icon: 'fa-handshake', color: '#eab308', gradStart: '#facc15', gradEnd: '#d97706' },
            espiritual: { label: 'Espiritual', icon: 'fa-praying-hands', color: '#a855f7', gradStart: '#c084fc', gradEnd: '#7c3aed' },
            psicoafectiva: { label: 'Psicoafectiva', icon: 'fa-heart', color: '#ec4899', gradStart: '#f472b6', gradEnd: '#e11d48' },
            acompanamiento: { label: 'Acompañamiento', icon: 'fa-users', color: '#3b82f6', gradStart: '#60a5fa', gradEnd: '#4f46e5' },
            fisica: { label: 'Física', icon: 'fa-running', color: '#ef4444', gradStart: '#f87171', gradEnd: '#e11d48' },
            pastoral: { label: 'Pastoral', icon: 'fa-dove', color: '#6366f1', gradStart: '#818cf8', gradEnd: '#2563eb' },
            default: { label: 'Evento', icon: 'fa-calendar-day', color: '#6b7280', gradStart: '#9ca3af', gradEnd: '#4b5563' }
        };

        // --- Data de Eventos ---
        const initialEvents = [
            { 
                id: 1, 
                title: "Eucaristía diaria", 
                description: "Participa de la Santa Misa de lunes a viernes y fortalece tu espíritu junto a toda la comunidad universitaria.",
                category: "espiritual", 
                date: "2026-09-30",
                time: "12:00", 
                image: "https://images.unsplash.com/photo-1549508477-3e484818ba7d?q=80&w=1000&auto=format&fit=crop", 
                link: "https://www.facebook.com/SoyCatolicaDelNorte/live_videos", 
                location: "Facebook Live",
                cta: "Participa"
            }
        ];

        let events = [...initialEvents];

        // --- Elementos del DOM ---
        const grid = document.getElementById('events-grid');
        const emptyState = document.getElementById('empty-state');

        // --- Funciones de Formateo ---
        const getSafeDate = (dateStr) => {
            const [year, month, day] = dateStr.split('-');
            return new Date(year, month - 1, day);
        };

        const formatTime = (timeString) => {
            const [hours, minutes] = timeString.split(':');
            const h = parseInt(hours, 10);
            const ampm = h >= 12 ? 'PM' : 'AM';
            return `${h % 12 || 12}:${minutes} ${ampm}`;
        };

        const getMonth = (dateStr) => getSafeDate(dateStr).toLocaleDateString('es-ES', {month: 'short'}).replace('.', '').toUpperCase();
        const getDay = (dateStr) => getSafeDate(dateStr).getDate();

        const renderEvents = () => {
            grid.innerHTML = '';
            
            if (events.length === 0) {
                emptyState.style.display = 'block';
            } else {
                emptyState.style.display = 'none';
                
                events.forEach((event, index) => {
                    const config = categoryConfig[event.category] || categoryConfig.default;
                    
                    const card = document.createElement('div');
                    card.className = 'glass-card';
                    card.style.animationDelay = `${index * 150}ms`;
                    // Inyectar colores de categoría dinámicamente como variables CSS
                    card.style.setProperty('--cat-color', config.color);
                    card.style.setProperty('--cat-grad-start', config.gradStart);
                    card.style.setProperty('--cat-grad-end', config.gradEnd);
                    
                    card.innerHTML = `
                        <div class="card-image-wrapper">
                            <img src="${event.image}" alt="${event.title}" class="card-image">
                            <div class="card-image-overlay"></div>
                            <div class="category-badge">
                                <i class="fas ${config.icon}" style="color: var(--cat-color)"></i> 
                                <span>${config.label}</span>
                            </div>
                        </div>
                        
                        <div class="card-content">
                            <div class="date-badge">
                                <span class="date-month">${getMonth(event.date)}</span>
                                <span class="date-day">${getDay(event.date)}</span>
                            </div>

                            <h3 class="card-title" title="${event.title}">${event.title}</h3>
                            <p class="card-desc">${event.description || 'Descripción breve disponible.'}</p>
                            
                            <div class="card-info-group">
                                <div class="info-item">
                                    <div class="info-icon"><i class="far fa-clock"></i></div>
                                    <span class="info-text">${formatTime(event.time)}</span>
                                </div>
                                <div class="info-item">
                                    <div class="info-icon"><i class="fas fa-link"></i></div>
                                    <span class="info-text">${event.location || 'Campus'}</span>
                                </div>
                            </div>
                            
                            <a href="${event.link}" target="_blank" class="btn-action">
                                ${event.cta || 'Participa'} <i class="fas fa-arrow-right" style="margin-left: 0.5rem; font-size: 0.875rem;"></i>
                            </a>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            }
        };

        // Renderizar inicial
        renderEvents();

    </script>
</body>
</html>
